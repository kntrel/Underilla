name: Build and Publish Release
on:
  push:
    branches: [main]

concurrency:
  group: underilla-main-release
  queue: max

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Read current version
        id: current
        run: |
          version="$(python3 .github/scripts/get-version.py)"
          echo "Current version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Read previous release version
        id: previous
        run: |
          version="$(python3 .github/scripts/get-version.py 'v*')"
          echo "Previous version: ${version:-none}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Gate release version
        id: gate
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          comparison="$(python3 .github/scripts/sameVer-compare.py "$CURRENT_VERSION" "$PREVIOUS_VERSION")"
          if [ "$comparison" -le 0 ]; then
            echo "Version has not advanced; skipping release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build

      - name: Read release name
        if: steps.gate.outputs.release == 'true'
        id: releaseName
        run: echo "value=$(./gradlew -q echoReleaseName)" >> "$GITHUB_OUTPUT"

      - name: Read compatible Minecraft versions
        if: steps.gate.outputs.release == 'true'
        id: worksOnMinecraftVersions
        run: |
          versions="$(./gradlew -q echoWorksOnMinecraftVersions)"
          echo "Supported Paper versions: $versions"
          echo "value=$versions" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        if: steps.gate.outputs.release == 'true'
        id: releaseNotes
        env:
          RELEASE_VERSION: ${{ steps.current.outputs.version }}
        run: |
          notes="$(python3 .github/scripts/get-md-section.py CHANGELOG.md "$RELEASE_VERSION")"
          delimiter="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          {
            echo "body<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Tag commit
        if: steps.gate.outputs.release == 'true'
        run: |
          git tag "${{ steps.current.outputs.tag }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.current.outputs.tag }}"

      - name: Create Release
        if: steps.gate.outputs.release == 'true'
        id: createRelease
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: underilla-paper/build/libs/Underilla-${{ steps.current.outputs.version }}.jar
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.current.outputs.tag }}
          name: ${{ steps.releaseName.outputs.value }}
          body: ${{ steps.releaseNotes.outputs.body }}
          skipIfReleaseExists: true

      - name: Publish to Hangar
        if: steps.gate.outputs.release == 'true'
        env:
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          RELEASE_NOTES: ${{ steps.releaseNotes.outputs.body }}
          RELEASE_VERSION: ${{ steps.current.outputs.version }}
          PAPER_VERSIONS: ${{ steps.worksOnMinecraftVersions.outputs.value }}
        run: |
          python3 .github/scripts/publish-to-hangar.py \
            --slug Underilla \
            --version "$RELEASE_VERSION" \
            --description "$RELEASE_NOTES" \
            --paper-versions "$PAPER_VERSIONS" \
            --file "underilla-paper/build/libs/Underilla-${RELEASE_VERSION}.jar"
