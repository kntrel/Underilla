name: Build and Publish Release
on:
  push:
    tags:
      - 'v*'
    
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tagged commit is on main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "Tag '$GITHUB_REF_NAME' does not point to a commit on main." >&2
            exit 1
          fi
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      - name: Verify tag matches Gradle version
        id: version
        run: |
          version="$(./gradlew -q echoVersion)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag '$GITHUB_REF_NAME' must match Gradle version 'v$version'." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releaseName=$(./gradlew -q echoReleaseName)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build


      - name: Create an empty CHANGELOG.md if missing
        run: |
          if [ ! -f CHANGELOG.md ]; then
            touch CHANGELOG.md
          fi

      - name: Remove all lines after the 2nd title in CHANGELOG.md
        shell: pwsh
        run: |
          $changelogPath = "CHANGELOG.md"
          $content = Get-Content -Path CHANGELOG.md
          $indices = ($content | ForEach-Object { $_ } | Select-String -Pattern "^#" | ForEach-Object { $_.LineNumber - 1 })

          if ($indices.Count -ge 2) {
              $startIndex = $indices[0]
              $endIndex = $indices[1]

              $changes = $content[$startIndex..($endIndex - 1)]

              $changes = $changes | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }

              $changes -join "`n" | Set-Content -Path $changelogPath
              Write-Output "Changelog updated"
          } else {
              Write-Output "Not as much lines as expected"
          }


      - name: Create Release
        id: createRelease
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: underilla-paper/build/libs/Underilla-${{ steps.version.outputs.version }}.jar
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.releaseName }}
          bodyFile: CHANGELOG.md
          skipIfReleaseExists: true
